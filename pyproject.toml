[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirrormind"
version = "0.1.0a1"
description = "Evidence-driven decision intelligence research platform"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.30,<1",
  "openpyxl>=3.1,<4"
]

[project.urls]
Homepage = "https://github.com/GustavoMFDS/MirrorMind"
Documentation = "https://github.com/GustavoMFDS/MirrorMind/tree/main/docs"
Issues = "https://github.com/GustavoMFDS/MirrorMind/issues"
Changelog = "https://github.com/GustavoMFDS/MirrorMind/blob/main/CHANGELOG.md"

[project.optional-dependencies]
uci = ["openpyxl>=3.1,<4"]
review = ["cryptography>=44,<47"]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.8", "openpyxl>=3.1,<4", "cryptography>=44,<47"]
quality = ["coverage==7.17.5", "mypy==1.20.2", "build==1.6.1"]
worldkernel = ["worldkernel @ git+https://github.com/GustavoMFDS/WorldKernel.git@9b133ef873f2b6a7206c9c5742d40df4fccdb04a"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.coverage.run]
branch = true
source = ["mirrormind"]

[tool.coverage.report]
precision = 2

[tool.mypy]
python_version = "3.11"

# These external libraries do not provide usable type metadata in the public environment.
[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "worldkernel", "worldkernel.*"]
ignore_missing_imports = true
