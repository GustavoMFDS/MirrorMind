[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirrormind"
version = "0.0.1"
description = "Evidence-driven decision intelligence platform (API scaffold)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
uci = ["openpyxl>=3.1,<4"]
review = ["cryptography>=44,<47"]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.8", "openpyxl>=3.1,<4", "cryptography>=44,<47"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
