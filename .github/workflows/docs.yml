name: Engineering documentation catalog
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  symbol-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify committed source catalog
        run: python scripts/docs/catalog.py --check
      - name: Verify linked repository atlas and Markdown links
        run: python scripts/docs/coverage.py --check
      - name: Verify curated reviewed claim and pytest references
        run: python scripts/docs/evidence.py --check
      - name: Verify reviewed capability status and source/test evidence
        run: python scripts/docs/capabilities.py --check
      - name: Build source symbol catalog
        run: |
          python scripts/docs/catalog.py --write
          python scripts/docs/catalog.py --check
      - name: Upload browsable generated catalog
        uses: actions/upload-artifact@v4
        with:
          name: engineering-symbol-catalog
          path: docs/engineering/generated/SYMBOLS.md
          if-no-files-found: error
