name: Research maintenance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-maintenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: python -m examples.synthetic_benchmark --repeats 5 --output "${{ runner.temp }}/benchmark.json"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-benchmark
          path: ${{ runner.temp }}/benchmark.json
          retention-days: 14
  release-rehearsal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: python -m examples.prepare_alpha_release --expected-sha "${{ github.sha }}" --output "${{ runner.temp }}/alpha-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-candidate-preparation-only
          path: ${{ runner.temp }}/alpha-candidate
          retention-days: 14
