<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc"><title id="title">Synthetic inventory policy comparison</title><desc id="desc">Mean cost bars for fixed cycle 5082.5, reorder point 2678.5, forecast-aware 950.5; mean stock 228, 88, 9; orders 4, 2, 15. All synthetic, no recommendation.</desc><rect width="1120" height="420" rx="22" fill="#0e1829"/><text x="40" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#f1f6ff" text-anchor="start">Inventory policy comparison</text><text x="40" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#91a8c7" text-anchor="start">Synthetic run | 28 days | 2 replications | seed 317 | 2-day lead time</text><text x="40" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#60d2c8" text-anchor="start">Mean cost (synthetic units)</text><text x="1080" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#60d2c8" text-anchor="end">Mean ending stock / orders</text><text x="40" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f6ff" text-anchor="start">Fixed cycle / fixed quantity</text><rect x="40" y="155" width="672" height="19" rx="5" fill="#22344b" stroke="#22344b"/><rect x="40" y="155" width="672.00" height="19" rx="5" fill="#60d2c8"/><text x="733" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#f1f6ff" text-anchor="start">5,082.5</text><text x="1080" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#c4d2e7" text-anchor="end">228 items / 4 orders</text><text x="40" y="215" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f6ff" text-anchor="start">Reorder point / fixed quantity</text><rect x="40" y="227" width="672" height="19" rx="5" fill="#22344b" stroke="#22344b"/><rect x="40" y="227" width="354.15" height="19" rx="5" fill="#60d2c8"/><text x="733" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#f1f6ff" text-anchor="start">2,678.5</text><text x="1080" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#c4d2e7" text-anchor="end">88 items / 2 orders</text><text x="40" y="287" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#f1f6ff" text-anchor="start">Forecast-aware order-up-to</text><rect x="40" y="299" width="672" height="19" rx="5" fill="#22344b" stroke="#22344b"/><rect x="40" y="299" width="125.67" height="19" rx="5" fill="#60d2c8"/><text x="733" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#f1f6ff" text-anchor="start">950.5</text><text x="1080" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#c4d2e7" text-anchor="end">9 items / 15 orders</text><path d="M40 357 H1080" stroke="#30435d"/><text x="40" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#c4d2e7" text-anchor="start">All three policies: 100% fill rate in this fictional example. No ranking or action authorized.</text><text x="40" y="401" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#91a8c7" text-anchor="start">Source: documented CLI execution on main 14252c78; not real retail data.</text></svg>
