<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="456" viewBox="0 0 1120 456" role="img" aria-labelledby="title desc"><title id="title">MirrorMind architecture</title><desc id="desc">Four stages from evidence through forecast, simulation and decision trace; retrieval is parallel and human review is non-authorizing.</desc><rect width="1120" height="456" rx="22" fill="#0e1829"/><path d="M40 61 L59 40 L78 61 L59 82 Z M78 61 L97 40 L116 61 L97 82 Z" fill="none" stroke="#60d2c8" stroke-width="3.5" stroke-linejoin="round"/><circle cx="78" cy="61" r="4" fill="#f1f6ff"/><text x="134" y="61" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#f1f6ff" text-anchor="start">MirrorMind</text><text x="135" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#91a8c7" text-anchor="start">EVIDENCE-DRIVEN DECISION INTELLIGENCE</text><text x="1080" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#60d2c8" text-anchor="end">RESEARCH / ENGINEERING</text><text x="1080" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#c4d2e7" text-anchor="end">Experimental architecture</text><path d="M40 106 H1080" stroke="#30435d"/><rect x="40" y="148" width="240" height="112" rx="12" fill="#18263b" stroke="#30435d"/><text x="56" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#60d2c8" text-anchor="start">01 / EVIDENCE</text><text x="56" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f6ff" text-anchor="start">Evidence</text><text x="56" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#c4d2e7" text-anchor="start">Bounded inputs</text><text x="56" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#c4d2e7" text-anchor="start">As-of eligibility</text><rect x="304" y="148" width="240" height="112" rx="12" fill="#18263b" stroke="#30435d"/><text x="320" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#60d2c8" text-anchor="start">02 / PREDICTION</text><text x="320" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f6ff" text-anchor="start">Forecast</text><text x="320" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#c4d2e7" text-anchor="start">Fixed baselines</text><text x="320" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#c4d2e7" text-anchor="start">Temporal diagnostics</text><rect x="568" y="148" width="240" height="112" rx="12" fill="#18263b" stroke="#30435d"/><text x="584" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#60d2c8" text-anchor="start">03 / SCENARIO</text><text x="584" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f6ff" text-anchor="start">Simulation</text><text x="584" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#c4d2e7" text-anchor="start">Paired policy runs</text><text x="584" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#c4d2e7" text-anchor="start">Optional WorldKernel</text><rect x="832" y="148" width="240" height="112" rx="12" fill="#18263b" stroke="#30435d"/><text x="848" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#60d2c8" text-anchor="start">04 / COMPARISON</text><text x="848" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#f1f6ff" text-anchor="start">Decision trace</text><text x="848" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#c4d2e7" text-anchor="start">Versioned outcomes</text><text x="848" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#c4d2e7" text-anchor="start">Engine provenance</text><path d="M280 204 H304" stroke="#60d2c8" stroke-width="2.5"/><path d="M297 199 L304 204 L297 209" fill="none" stroke="#60d2c8" stroke-width="2"/><path d="M544 204 H568" stroke="#60d2c8" stroke-width="2.5"/><path d="M561 199 L568 204 L561 209" fill="none" stroke="#60d2c8" stroke-width="2"/><path d="M808 204 H832" stroke="#60d2c8" stroke-width="2.5"/><path d="M825 199 L832 204 L825 209" fill="none" stroke="#60d2c8" stroke-width="2"/><rect x="40" y="291" width="502" height="100" rx="12" fill="#142136" stroke="#30435d"/><text x="56" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#8eacff" text-anchor="start">PARALLEL RESEARCH</text><text x="56" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#f1f6ff" text-anchor="start">Scoped BM25 retrieval</text><text x="56" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#c4d2e7" text-anchor="start">Fictional corpus; cited excerpts; future agent orchestration</text><rect x="568" y="291" width="504" height="100" rx="12" fill="#142136" stroke="#30435d"/><text x="584" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#8eacff" text-anchor="start">HUMAN REVIEW BOUNDARY</text><text x="584" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#f1f6ff" text-anchor="start">Reviewable conditional comparison</text><text x="584" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#c4d2e7" text-anchor="start">No automatic approval, order placement or business writes</text><path d="M952 260 V275 H820 V291" fill="none" stroke="#60d2c8" stroke-width="2"/><path d="M815 284 L820 291 L825 284" fill="none" stroke="#60d2c8" stroke-width="2"/><text x="40" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#91a8c7" text-anchor="start">Synthetic data and explicit assumptions; no empirical or production claim.</text><text x="1080" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#91a8c7" text-anchor="end">M1 + initial M2 retrieval</text></svg>
